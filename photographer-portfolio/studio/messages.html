<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages &mdash; Aditi Rane Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/studio.css">
  <script src="assets/js/img-fallback.js"></script>
</head>
<body>
  <header class="studio-nav">
    <div class="wrap">
      <a class="studio-brand" href="index.html">Aditi Rane <span>Studio</span></a>
      <nav class="studio-links" aria-label="Studio navigation">
        <a href="index.html">Dashboard</a>
        <a href="bookings.html">Bookings</a>
        <a href="galleries.html">Client Galleries</a>
        <a href="upload.html">Upload Center</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="messages.html" aria-current="page">Messages</a>
      </nav>
      <div class="studio-right">
        <a href="../contact.html" target="_blank">View Contact Page &rarr;</a>
        <button type="button" id="signOutBtn">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="wrap" style="padding-bottom: 80px;">
    <div class="view-head">
      <div>
        <span class="label">General Inquiries</span>
        <h1>Studio <em>Messages</em></h1>
      </div>
    </div>

    <!-- Messages Table -->
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width: 100px;">Status</th>
            <th>Received</th>
            <th>Sender</th>
            <th>Subject</th>
            <th style="width: 45%;">Message</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="messagesTbody">
          <tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--muted);">Loading messages...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/demo-store.js"></script>
  <script src="assets/js/emails.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    (function() {
      Api.auth.isOwner().then(function(isOwner) {
        if (!isOwner) window.location.href = 'login.html';
      });

      document.getElementById('signOutBtn').addEventListener('click', function() {
        Api.auth.signOut('owner').then(function() { window.location.href = 'login.html'; });
      });

      var tbody = document.getElementById('messagesTbody');
      var messages = [];

      function loadMessages() {
        Api.studio.messages().then(function(rows) {
          messages = rows;
          renderTable();
        });
      }

      function renderTable() {
        tbody.innerHTML = '';
        if (!messages.length) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--muted);">No messages found.</td></tr>';
          return;
        }

        messages.forEach(function(m) {
          var tr = document.createElement('tr');
          var isRead = m.is_read;

          tr.innerHTML =
            '<td><span class="badge ' + (isRead ? 'badge--draft' : 'badge--new') + '">' + (isRead ? 'Read' : 'Unread') + '</span></td>' +
            '<td>' + Api.format.relative(m.created_at) + '</td>' +
            '<td><div class="cell-title">' + Api.format.esc(m.name) + '</div><div class="cell-sub">' + Api.format.esc(m.email) + '</div></td>' +
            '<td><strong>' + Api.format.esc(m.subject || '(No subject)') + '</strong></td>' +
            '<td><div style="font-size: 13.5px; line-height: 1.5; color: var(--ink); white-space: pre-wrap;">' + Api.format.esc(m.message) + '</div></td>' +
            '<td><div style="display:flex; gap: 8px;">' +
              '<a class="btn btn--small" href="mailto:' + encodeURIComponent(m.email) + '?subject=' + encodeURIComponent('Re: ' + (m.subject || 'Inquiry')) + '">Reply</a>' +
              '<button type="button" class="btn btn--small toggle-read">' + (isRead ? 'Mark Unread' : 'Mark Read') + '</button>' +
              '<button type="button" class="btn btn--danger btn--small del-btn">Delete</button>' +
            '</div></td>';

          // Toggle read/unread
          tr.querySelector('.toggle-read').addEventListener('click', function() {
            var newStatus = !m.is_read;
            Api.studio.updateMessage(m.id, { is_read: newStatus }).then(function() {
              m.is_read = newStatus;
              renderTable();
            });
          });

          // Delete
          tr.querySelector('.del-btn').addEventListener('click', function() {
            if (confirm('Delete message from ' + m.name + '?')) {
              Api.studio.deleteMessage(m.id).then(function() {
                messages = messages.filter(function(x) { return x.id !== m.id; });
                renderTable();
              });
            }
          });

          tbody.appendChild(tr);
        });
      }

      loadMessages();
    })();
  </script>
</body>
</html>
