</head>
<body>
  <header class="studio-nav">
    <div class="wrap">
      <a class="studio-brand" href="index.html">Ritesh Farswan <span>Studio</span></a>
      <nav class="studio-links" aria-label="Studio navigation">
        <a href="index.html">Dashboard</a>
        <a href="bookings.html">Bookings <span class="studio-nav-badge badge-bookings is-zero">0</span></a>
        <a href="galleries.html">Client Galleries</a>
        <a href="upload.html">Upload Center</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="messages.html" aria-current="page">Messages <span class="studio-nav-badge badge-messages is-zero">0</span></a>
      </nav>
      <div class="studio-right">
        <button type="button" class="btn-install-app" id="installAppBtn" style="display:none;" title="Install Studio WebApp on phone or desktop">Install App</button>
        <a href="../developer.html" target="_blank" title="Systems Architect &amp; Engineering by Shomay Singh Parihar">Developer &rarr;</a>
        <a href="../contact.html" target="_blank"><span class="long-text">View Contact Page &rarr;</span><span class="short-text">Site &rarr;</span></a>
        <button type="button" id="signOutBtn">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="wrap" style="padding-bottom: 80px;">
    <div class="view-head">
      <div>
        <span class="label">General Inquiries</span>
        <h1>Studio <em>Messages</em></h1>
      </div>
    </div>

    <!-- Messages Table -->
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width: 100px;">Status</th>
            <th>Received</th>
            <th>Sender</th>
            <th>Subject</th>
            <th style="width: 45%;">Message</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="messagesTbody">
          <tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--muted);">Loading messages...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/demo-store.js"></script>
  <script src="assets/js/emails.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    (function() {
      Api.auth.isOwner().then(function(isOwner) {
        if (!isOwner) window.location.href = 'login.html';
      });

      var signOutBtn = document.getElementById('signOutBtn');
      if (signOutBtn) {
        signOutBtn.addEventListener('click', function(e) {
          e.preventDefault();
          signOutBtn.disabled = true;
          signOutBtn.textContent = 'Signing out...';
          Api.auth.signOut('owner').finally(function() {
            window.location.href = 'login.html';
          });
        });
      }

      var tbody = document.getElementById('messagesTbody');
      var messages = [];

      function loadMessages() {
        Api.studio.messages().then(function(rows) {
          messages = rows;
          renderTable();
        });
      }

      function renderTable() {
        tbody.innerHTML = '';
        if (!messages.length) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--muted);">No messages found.</td></tr>';
          return;
        }

        messages.forEach(function(m) {
          var tr = document.createElement('tr');
          var isRead = m.is_read;

          tr.innerHTML =
            '<td data-label="Status"><span class="badge ' + (isRead ? 'badge--draft' : 'badge--new') + '">' + (isRead ? 'Read' : 'Unread') + '</span></td>' +
            '<td data-label="Received">' + Api.format.relative(m.created_at) + '</td>' +
            '<td data-label="Sender"><div class="cell-title">' + Api.format.esc(m.name) + '</div><div class="cell-sub">' + Api.format.esc(m.email) + '</div></td>' +
            '<td data-label="Subject"><strong>' + Api.format.esc(m.subject || '(No subject)') + '</strong></td>' +
            '<td data-label="Message"><div style="font-size: 13.5px; line-height: 1.5; color: var(--ink); white-space: pre-wrap;">' + Api.format.esc(m.message) + '</div></td>' +
            '<td data-label="Actions"><div class="table-actions-cell">' +
              '<a class="btn btn--small" href="mailto:' + encodeURIComponent(m.email) + '?subject=' + encodeURIComponent('Re: ' + (m.subject || 'Inquiry')) + '">Reply</a>' +
              '<button type="button" class="btn btn--small toggle-read">' + (isRead ? 'Mark Unread' : 'Mark Read') + '</button>' +
              '<button type="button" class="btn btn--danger btn--small del-btn">Delete</button>' +
            '</div></td>';

          // Toggle read/unread
          tr.querySelector('.toggle-read').addEventListener('click', function() {
            var newStatus = !m.is_read;
            Api.studio.updateMessage(m.id, { is_read: newStatus }).then(function() {
              m.is_read = newStatus;
              renderTable();
            });
          });

          // Delete
          tr.querySelector('.del-btn').addEventListener('click', function() {
            if (confirm('Delete message from ' + m.name + '?')) {
              Api.studio.deleteMessage(m.id).then(function() {
                messages = messages.filter(function(x) { return x.id !== m.id; });
                renderTable();
              });
            }
          });

          tbody.appendChild(tr);
        });
      }

      loadMessages();
    })();
  </script>

  <!-- Mobile Native Bottom Navigation Dock -->

      <span>Galleries</span>
    </a>
    <a href="portfolio.html" class="studio-bottom-item">

      <span>Portfolio</span>
    </a>
    <a href="upload.html" class="studio-bottom-item">

    <a href="messages.html" class="studio-bottom-item is-active">

      <span class="studio-bottom-badge badge-messages is-zero">0</span>

  </nav>

  <script src="assets/js/studio-app.js"></script>
