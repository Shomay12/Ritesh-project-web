<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a18"/>
      <stop offset="100%" stop-color="#0d0c0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e7d3"/>
      <stop offset="50%" stop-color="#cf714c"/>
      <stop offset="100%" stop-color="#895843"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" stroke="#2d2925" stroke-width="6"/>
  
  <!-- Outer Optical Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2a2724" stroke-width="12" stroke-dasharray="6 14"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.85"/>
  
  <!-- Lens Barrel Inner -->
  <circle cx="256" cy="256" r="144" fill="#141312" stroke="#38342f" stroke-width="4"/>
  
  <!-- Aperture Blades (6 Blades) -->
  <g stroke="url(#gold)" stroke-width="3" fill="none" opacity="0.75">
    <path d="M 256,120 L 370,220" />
    <path d="M 370,220 L 330,360" />
    <path d="M 330,360 L 190,380" />
    <path d="M 190,380 L 140,270" />
    <path d="M 140,270 L 180,150" />
    <path d="M 180,150 L 256,120" />
  </g>
  
  <!-- Central Glass Element -->
  <circle cx="256" cy="256" r="70" fill="#1a1816" stroke="#cf714c" stroke-width="3"/>
  <circle cx="256" cy="256" r="45" fill="#24211e" opacity="0.9"/>
  
  <!-- Typographic 'R' Monogram -->
  <text x="256" y="274" font-family="'Cormorant Garamond', Georgia, serif" font-size="76" font-style="italic" font-weight="400" fill="#f7f5f0" text-anchor="middle" letter-spacing="1">R</text>
  
  <!-- Studio Text Ribbon at bottom -->
  <text x="256" y="460" font-family="'Jost', 'Helvetica Neue', sans-serif" font-size="24" font-weight="500" fill="#a39c91" text-anchor="middle" letter-spacing="7">STUDIO</text>
  
  <!-- Lens reflection highlight -->
  <path d="M 220,205 A 55 55 0 0 1 290,205" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.2"/>
</svg>